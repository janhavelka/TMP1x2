[platformio]
src_dir = .
default_envs = esp32s3dev

[dependency_pins]
arduino_platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
native_platform = platformio/native@1.2.1

[env]
platform = ${dependency_pins.arduino_platform}
framework = arduino
extra_scripts = pre:scripts/generate_version.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = send_on_enter, esp32_exception_decoder, colorize
monitor_eol = LF
monitor_echo = yes
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Werror=return-type
  -Iinclude
  -Iexamples
build_src_filter =
  -<*>
  +<examples/01_basic_bringup_cli/**>
  +<examples/common/**>
  +<src/**>
  +<include/**>

; -------------------------
; ESP32-S3 dev config
; -------------------------
[env:esp32s3dev]
extends = env
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; -------------------------
; ESP32-S2 dev config
; -------------------------
[env:esp32s2dev]
extends = env
board = esp32-s2-saola-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_upload.after_reset = no_reset_stub
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1

; -------------------------
; Native host tests
; -------------------------
[env:native]
platform = ${dependency_pins.native_platform}
framework =
test_framework = custom
test_build_src = true
build_src_filter =
  -<*>
  +<src/**>
  +<include/**>
build_flags =
  -std=gnu++17
  -Iinclude
  -Iexamples
extra_scripts = pre:scripts/generate_version.py
test_ignore =
  core_no_arduino
  cli

; -------------------------
; Native core compile/link without Arduino/Wire include paths
; -------------------------
[env:native_core_no_arduino]
platform = ${dependency_pins.native_platform}
framework =
build_src_filter =
  -<*>
  +<src/**>
  +<include/**>
  +<test/core_no_arduino/**>
build_flags =
  -std=c++17
  -Wall
  -Wextra
  -Wpedantic
  -Wconversion
  -Wsign-conversion
  -Werror
  -Iinclude
lib_deps =
extra_scripts = pre:scripts/generate_version.py
